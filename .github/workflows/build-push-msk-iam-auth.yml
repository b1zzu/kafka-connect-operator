name: Build and Push MSK IAM Auth Image

on:
  push:
    branches:
      - main
    paths:
      - 'containers/msk-iam-auth/**'
  pull_request:
    paths:
      - 'containers/msk-iam-auth/**'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/msk-iam-auth

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract MSK IAM Auth version from Dockerfile
        id: version
        run: |
          version=$(grep -oP 'ARG MSK_IAM_AUTH_VERSION=\K\S+' containers/msk-iam-auth/Dockerfile)
          echo "msk_iam_auth_version=$version" >> "$GITHUB_OUTPUT"

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.version.outputs.msk_iam_auth_version }},enable={{is_default_branch}}

      - name: Build and push MSK IAM Auth image
        uses: docker/build-push-action@v6
        with:
          context: containers/msk-iam-auth
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
