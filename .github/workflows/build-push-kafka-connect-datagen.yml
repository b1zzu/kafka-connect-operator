name: Build and Push Kafka Connect Datagen Image

on:
  push:
    branches:
      - main
    paths:
      - 'containers/kafka-connect-datagen/**'
  pull_request:
    paths:
      - 'containers/kafka-connect-datagen/**'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/kafka-connect-datagen

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Kafka Connect Datagen version from Dockerfile
        id: version
        run: |
          version=$(grep -oP 'ARG CONNECT_DATAGEN_VERSION=\K\S+' containers/kafka-connect-datagen/Dockerfile)
          echo "connect_datagen_version=$version" >> "$GITHUB_OUTPUT"

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.version.outputs.connect_datagen_version }},enable={{is_default_branch}}

      - name: Build and push Kafka Connect Datagen image
        uses: docker/build-push-action@v7
        with:
          context: containers/kafka-connect-datagen
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
