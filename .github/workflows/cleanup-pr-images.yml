name: Cleanup PR Images

on:
  pull_request:
    types: [closed]

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      packages: write

    steps:
      - name: Delete PR image tag
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          package: kafka-connect-operator
          delete-tags: pr-${{ github.event.pull_request.number }}
