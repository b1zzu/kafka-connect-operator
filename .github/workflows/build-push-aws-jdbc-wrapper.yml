name: Build and Push AWS Advanced JDBC Wrapper Image

on:
  push:
    branches:
      - main
    paths:
      - 'containers/aws-advanced-jdbc-wrapper/**'
  pull_request:
    paths:
      - 'containers/aws-advanced-jdbc-wrapper/**'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/aws-advanced-jdbc-wrapper

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract AWS JDBC Wrapper version from Dockerfile
        id: version
        run: |
          version=$(grep -oP 'ARG AWS_JDBC_WRAPPER_VERSION=\K\S+' containers/aws-advanced-jdbc-wrapper/Dockerfile)
          echo "aws_jdbc_wrapper_version=$version" >> "$GITHUB_OUTPUT"

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.version.outputs.aws_jdbc_wrapper_version }},enable={{is_default_branch}}

      - name: Build and push AWS Advanced JDBC Wrapper image
        uses: docker/build-push-action@v7
        with:
          context: containers/aws-advanced-jdbc-wrapper
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
