apiVersion: kafka-connect.b1zzu.net/v1alpha1
kind: Cluster
metadata:
  name: my-cluster-connect
spec:
  plugins:
    - name: sample-plugins
      image: ghcr.io/b1zzu/kafka-connect-library/sample-plugins:4.4.0
      pullPolicy: IfNotPresent
    - name: test
      image: ghcr.io/b1zzu/kafka-connect-test:v0.1.0
      pullPolicy: IfNotPresent
  secrets:
    - name: config-provider-test
      secretRef:
        name: config-provider-test
  configProviders:
    - name: dir
      class: org.apache.kafka.common.config.provider.DirectoryConfigProvider
      params:
        allowed.paths: /secrets
  jvmOptions:
    heapOpts: "-Xms512m -Xmx512m"
    extraOpts:
      - -Dkco.e2e=true
  env:
    - name: CONNECT_E2E_VALUE
      value: "false"
